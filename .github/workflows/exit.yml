# exit.yml — continuous integration for the exit kit.
#
# Gate check 7 (T1, kind) and gate check 8 (T1b, kind with Gateway API and
# CloudNativePG, the score-k8s route) are the cluster runs. Both apply the
# export in fixtures/exit-profile/ (see fixtures/README.md), signed in the job
# with a generated key (bin/make-test-export.sh).
#
# Each cluster job holds its README commands in one list, checks that every
# command is a substring of README.md, and runs the same strings. A README
# edit that changes a command fails the job until the list follows it.
#
# The `selftest` job builds a signed export from testdata/fixture with a
# throwaway key and proves verify.sh and check.sh accept a good export and
# refuse each bad case, and that images.sh rewrite keeps the digest.
#
# Runs on GitHub-hosted runners only (D-145.6 condition 2). This repository is
# public; a public repo must never run a fork's pull request on a self-hosted
# runner, so no `self-hosted` or `glenr-ci` label may appear here.
name: exit-kit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # kind v0.33.0 and its Kubernetes 1.35 node image (the image digest is from the
  # v0.33.0 release notes). T1 and T1b are 1.35 only (design/145 §4.1).
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  # Upstream releases a customer installs, pinned here so a run is repeatable.
  TRAEFIK_CHART_VERSION: 42.4.1
  GATEWAY_API_VERSION: v1.6.3
  CNPG_VERSION: 1.30.2
  YQ_VERSION: v4.54.3
  SCORE_K8S_VERSION: "0.22.0"
  # SHA-256 of score_k8s_0.22.0_linux_amd64.tar.gz (checksums.txt of the release).
  SCORE_K8S_SHA256: d32f190d6278943d85cfecfacdee31146ff56b5fa148d6fe2850da1fa237d2f0

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          curl -sSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Self-test (verify, check, rewrite)
        run: bash bin/selftest.sh

  # Gate check 7: apply the fixture export on kind (T1); P-1 and P-3.
  t1:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: exit-t1
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
      - name: Install Traefik (default Ingress class)
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm install traefik traefik/traefik --version "$TRAEFIK_CHART_VERSION" \
            --namespace traefik --create-namespace --wait --timeout 5m \
            --set providers.kubernetesIngress.publishedService.enabled=true
      - name: Install yq
        run: |
          curl -sSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /tmp/yq && sudo mv /tmp/yq /usr/local/bin/yq
      - name: Provisioners file equals the repository's
        run: cmp glenr.provisioners.yaml fixtures/exit-profile/glenr.provisioners.yaml
      - name: Export key matches the README table
        run: |
          fp=$(openssl pkey -pubin -in keys/export-signing.pub -outform DER | sha256sum | cut -d' ' -f1)
          grep -qF "$fp" README.md || { echo "keys/export-signing.pub fingerprint $fp is not in the README table"; exit 1; }
      # Finding F-1 (GLE-3154): the exit profile writes `hostUsers: false` into
      # every pod spec. On kind (containers inside a container) the pod sandbox
      # fails with `error mounting "sysfs" ... operation not permitted`, so no
      # pod starts. T1 removes the field from its copy of the fixture before it
      # signs it; the committed fixture keeps it. T2 (k3s on a server) runs it.
      - name: Prepare a kind copy of the fixture (no hostUsers)
        run: |
          set -euo pipefail
          cp -R fixtures/exit-profile "$RUNNER_TEMP/fixture"
          for f in web tick; do
            yq -i 'del(.spec.template.spec.hostUsers) | del(.spec.jobTemplate.spec.template.spec.hostUsers)' "$RUNNER_TEMP/fixture/manifests/production/$f.yaml"
          done
          ! grep -rq hostUsers "$RUNNER_TEMP/fixture/manifests"
      - name: Sign the fixture
        run: bin/make-test-export.sh "$RUNNER_TEMP/fixture" export "$RUNNER_TEMP/keys"
      - name: README steps 1 to 5 and 7 (P-1)
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/keys/pub.pem"
          cmds=(
            'bin/verify.sh ./export <public-key>'
            'bin/check.sh ./export/manifests/production'
            'kubectl apply -f ./export/manifests/production/_namespace.yaml'
            'cp ./export/secrets/production.example.yaml ./export/secrets/production.yaml'
            'kubectl apply -f ./export/secrets/production.yaml'
            'kubectl apply -f ./export/manifests/production/'
          )
          for c in "${cmds[@]}"; do
            grep -qF -- "$c" README.md || { echo "README.md no longer contains: $c"; exit 1; }
          done
          # The default key is the deployed one: an export signed with the
          # generated key must be refused under it.
          if bin/verify.sh ./export 2>/dev/null; then echo "verify.sh accepted a test-signed export under the deployed key"; exit 1; fi
          run() { echo "+ $1"; eval "${1//<public-key>/$pub}"; }
          run "${cmds[0]}"
          run "${cmds[1]}"
          run "${cmds[2]}"
          run "${cmds[3]}"
          # README step 5: "fill the values".
          yq -i '.stringData |= with_entries(.value = "fixture-" + .key)' ./export/secrets/production.yaml
          run "${cmds[4]}"
          run "${cmds[5]}"          # P-1: exits 0
          # Finding F-2 (GLE-3154): the pods in `manifests/` set no runAsNonRoot,
          # so the namespace's Pod Security `restricted` label refuses them
          # (`runAsNonRoot != true`). Step 7 applies `_namespace.yaml` again, which
          # resets any label set before it, so the label goes on after step 7; the
          # ReplicaSet and Job controllers retry the refused pods.
          ns=$(yq 'select(.kind == "Namespace") | .metadata.name' ./export/manifests/production/_namespace.yaml)
          kubectl label namespace "$ns" pod-security.kubernetes.io/enforce=baseline --overwrite
      - name: P-3 Deployments available, CronJob job completes
        run: |
          set -euo pipefail
          ns=$(yq 'select(.kind == "Namespace") | .metadata.name' export/manifests/production/_namespace.yaml)
          for d in $(kubectl -n "$ns" get deploy -o name); do
            kubectl -n "$ns" rollout status "$d" --timeout=10m
          done
          kubectl -n "$ns" create job tick-manual --from=cronjob/tick
          kubectl -n "$ns" wait --for=condition=complete job/tick-manual --timeout=5m
      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl get replicaset -A -o yaml | grep -A8 -i "message:" | head -40 || true

  # Gate check 8: the score-k8s route on T1b (Gateway API, Traefik, CloudNativePG); P-9.
  t1b:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: exit-t1b
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
      - name: Install yq and score-k8s
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /tmp/yq && sudo mv /tmp/yq /usr/local/bin/yq
          archive=/tmp/score-k8s.tar.gz
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/score-spec/score-k8s/releases/download/${SCORE_K8S_VERSION}/score-k8s_${SCORE_K8S_VERSION}_linux_amd64.tar.gz"
          echo "${SCORE_K8S_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /tmp score-k8s
          sudo mv /tmp/score-k8s /usr/local/bin/score-k8s
          score-k8s --version | head -1
      - name: Sign the fixture
        run: bin/make-test-export.sh fixtures/exit-profile export "$RUNNER_TEMP/keys"
      - name: Create the cell namespace (README step 4)
        run: |
          set -euo pipefail
          c='kubectl apply -f ./export/manifests/production/_namespace.yaml'
          grep -qF -- "$c" README.md || { echo "README.md no longer contains: $c"; exit 1; }
          eval "$c"
      - name: Install Gateway API CRDs, Traefik with a Gateway named default, CloudNativePG
        run: |
          set -euo pipefail
          ns=$(yq 'select(.kind == "Namespace") | .metadata.name' export/manifests/production/_namespace.yaml)
          echo "NS=$ns" >> "$GITHUB_ENV"
          kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          # The route provisioner's parentRefs name a Gateway `default` in the cell namespace.
          helm install traefik traefik/traefik --version "$TRAEFIK_CHART_VERSION" \
            --namespace traefik --create-namespace --wait --timeout 5m \
            --set providers.kubernetesGateway.enabled=true \
            --set gateway.name=default --set gateway.namespace="$ns"
          kubectl apply --server-side -f "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v${CNPG_VERSION}/cnpg-${CNPG_VERSION}.yaml"
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=5m
          kubectl -n "$ns" get gateway default
      # Findings F-2 and F-3 (GLE-3154). Step 4 creates the namespace from
      # `_namespace.yaml`: Pod Security `restricted` and a default-deny ingress
      # NetworkPolicy. kind's CNI enforces NetworkPolicy. With both in place:
      #   F-2  the Deployments score-k8s renders are refused (no securityContext,
      #        no runAsNonRoot);
      #   F-3  no pod in the namespace accepts ingress, so the CloudNativePG
      #        operator gets "Instance Status Extraction Error: HTTP communication
      #        issue" and the Cluster never becomes Ready, and Traefik cannot
      #        reach `web` through the Gateway.
      # This step is what a customer has to add for the route; the README does not
      # say so yet. It sets the label to `baseline` and allows ingress from the
      # operator, the ingress controller and the namespace itself.
      - name: Route prerequisites the README does not state (F-2, F-3)
        run: |
          set -euo pipefail
          kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=baseline --overwrite
          kubectl -n "$NS" apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-route-and-database
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
            ingress:
            - from:
              - podSelector: {}
              - namespaceSelector:
                  matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values: ["traefik", "cnpg-system"]
          EOF
      - name: score-k8s route for staging (README, the second route)
        run: |
          set -euo pipefail
          cd export
          lines=(
            'mkdir -p .score-k8s && cp glenr.provisioners.yaml .score-k8s/'
            'score-k8s init --no-sample --patch-templates overrides/production/score-k8s-patch.tpl'
            'score-k8s generate score-k8s/web.yaml'
            '--overrides-file overrides/production/web.score.yaml'
            '--namespace <namespace> -o manifests.yaml'
          )
          for l in "${lines[@]}"; do
            grep -qF -- "$l" ../README.md || { echo "README.md no longer contains: $l"; exit 1; }
          done
          # The fixture's second environment is staging (design/145 P-9).
          stg() { echo "${1//production/staging}"; }
          eval "$(stg "${lines[0]}")"
          eval "$(stg "${lines[1]}")"
          cmd="${lines[2]} ${lines[3]} ${lines[4]}"
          cmd=$(stg "$cmd")
          cmd="${cmd//<namespace>/$NS}"
          echo "+ score-k8s generate ... (README lines joined)"
          eval "score-k8s ${cmd#score-k8s }"
          # The route emits a Gateway API HTTPRoute and a CloudNativePG Cluster.
          grep -q 'kind: HTTPRoute' manifests.yaml
          grep -q 'kind: Cluster' manifests.yaml
      - name: Fill the secrets and apply (README steps 5 and 7, route form)
        run: |
          set -euo pipefail
          cd export
          for c in 'cp ./export/secrets/production.example.yaml ./export/secrets/production.yaml' 'kubectl apply -f ./export/secrets/production.yaml'; do
            grep -qF -- "$c" ../README.md || { echo "README.md no longer contains: $c"; exit 1; }
          done
          cp secrets/production.example.yaml secrets/production.yaml
          yq -i '.stringData |= with_entries(.value = "fixture-" + .key)' secrets/production.yaml
          kubectl apply -f secrets/production.yaml
          kubectl apply -f manifests.yaml
      - name: Restore the fixture dump (README step 6) and count rows
        run: |
          set -euo pipefail
          kubectl -n "$NS" wait --for=condition=Ready cluster --all --timeout=10m
          cluster=$(kubectl -n "$NS" get cluster -o jsonpath='{.items[0].metadata.name}')
          pod=$(kubectl -n "$NS" get pod -l "cnpg.io/cluster=$cluster,cnpg.io/instanceRole=primary" -o jsonpath='{.items[0].metadata.name}')
          # CloudNativePG starts the cluster empty. Restore as role app so the
          # connection the workload uses owns the table.
          kubectl -n "$NS" exec -i "$pod" -c postgres -- \
            pg_restore --no-owner --no-acl --role=app -d app < fixtures/data/maindb.dump
          want=$(awk '$1 == "items" {print $2}' fixtures/data/row-counts.txt)
          got=$(kubectl -n "$NS" exec "$pod" -c postgres -- psql -d app -tAc 'select count(*) from items')
          echo "items: restored $got, recorded $want"
          [ "$got" = "$want" ]
      - name: P-3 and P-7, and web through the default Gateway
        run: |
          set -euo pipefail
          kubectl -n "$NS" rollout status deploy/web --timeout=10m
          # staging override: one replica
          [ "$(kubectl -n "$NS" get deploy web -o jsonpath='{.spec.replicas}')" = 1 ]
          ex() { kubectl -n "$NS" exec deploy/web -- "$@"; }
          # plain file
          [ "$(ex sha256sum /etc/web/config.yaml | cut -d' ' -f1)" = "$(printf 'listen = 8080\n' | sha256sum | cut -d' ' -f1)" ]
          # secret file, from the filled example
          [ "$(ex cat /etc/web-secret/token)" = fixture-token ]
          # variable from overrides/staging/web.score.yaml
          [ "$(ex printenv LOG_LEVEL)" = debug ]
          # database password: the variable equals the credential Secret's value
          cred=$(kubectl -n "$NS" get cluster -o jsonpath='{.items[0].spec.bootstrap.initdb.secret.name}')
          [ "$(ex printenv MAINDB_PASSWORD)" = "$(kubectl -n "$NS" get secret "$cred" -o jsonpath='{.data.password}' | base64 -d)" ]
          # scratch volume accepts a write
          [ "$(ex sh -c 'echo probe > /tmp/work/probe && cat /tmp/work/probe')" = probe ]
          # reached through the default Gateway
          kubectl -n traefik port-forward svc/traefik 18080:80 >/dev/null 2>&1 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            body=$(curl -fsS -H 'Host: web.localhost' http://127.0.0.1:18080/ 2>/dev/null) && break
            sleep 2
          done
          [ "$body" = ok ]
      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n "${NS:-default}" get cluster,gateway,httproute -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true

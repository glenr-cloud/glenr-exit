apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: exit-gate-production
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: exit-gate
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
      - name: web
        image: registry.glenr.example/acme/web@sha256:1111111111111111111111111111111111111111111111111111111111111111
        ports:
        - name: http
          containerPort: 3000
        - name: admin
          containerPort: 3001
        env:
        - name: EXIT_CHECK_FILES
          value: /etc/web/config.txt
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: exit-gate-production
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: admin
    port: 3001
    targetPort: admin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: exit-gate-production
spec:
  rules:
  - host: web.production.exit-gate.example.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80

# glenr.provisioners.yaml — score-k8s provisioners for the Glenr resource types.
#
# Status: EXPORT-ONLY (design/129 P-1, D-PORT.3; design/22 rule 8 as amended
# 2026-11-03). The Glenr platform renders with the operator's `render` package,
# never with this file. This file describes what that renderer serves, for a
# customer who runs the same Score document with `score-k8s` on a cluster of
# their own. It is tested against the platform render by behaviour parity
# (`render/provisioners_parity_test.go`, CI job `provisioner-parity`).
#
# File: the export copy of glenr.provisioners.yaml, byte for byte the file in
# github.com/glenr-cloud/glenr-exit. Licence: Apache-2.0 (LICENSE in that repository).
#
# Use: `score-k8s init`, then copy this file into `.score-k8s/`. The file name
# sorts before `zz-default.provisioners.yaml`, and score-k8s takes the first
# provisioner that matches a resource, so a type that also has a score-k8s default
# replaces it (`volume` overrides the default `volume` provisioner to add a
# `sizeLimit`; `external-api` and `secret` have no default).
#
# What this file does NOT serve is listed per type, with the reason, in
# `provisionerDivergences` in render/provisioners_parity_test.go and in the
# summary of the CI job `provisioner-parity`. The test fails when that list and
# the behaviour disagree.
#
# DATABASES: Glenr stores a database connection as `type: service` with
# `params.kind: postgres`; this file serves `type: postgres` and refuses the
# stored form. The cell export (E-1) rewrites each connection to
# `{type: postgres, id: <db>}` and leaves the database app's own document out of
# the score-k8s set. Without that rewrite an exported cell with a database does
# not run with this file.
#
# SECRETS: a `secret` resource (design/142 D-142.3) is served from a Secret you
# create, never from a ConfigMap. The `secret` provisioner below returns one
# Secret reference per key listed in `params.keys` (`encodeSecretRef`), so a
# workload `files` entry whose content is exactly `${resources.<s>.<KEY>}` is
# mounted from that Secret key and its value never reaches a ConfigMap
# (design/145 F-145-1; measured 2026-11-21 on score-k8s 0.22.0: 0 ConfigMaps
# hold the value). score-k8s merges the Secret mount and the ConfigMap mount of
# the same directory into one projected volume, so a secret file and a plain
# file can share a directory and keep their target paths. The provisioner also
# returns `source`, the Secret as a volume source, for a workload that mounts the
# Secret with a `volumes` entry. It creates no Secret object and holds no value.
# You create the Secret named in `params.name` from the filled
# `secrets/<env>.example.yaml`, as on the `manifests/` route.

# --- route -------------------------------------------------------------------
# The platform serves every public app on a composed hostname and an HTTPRoute.
# score-k8s knows neither the zone nor the organisation, so the host is
# `<app>.localhost`. Change it by editing `state.host` below. `parentRefs` names a
# Gateway called `default` in the route's namespace; edit it to your Gateway.
- uri: template://glenr/route
  type: route
  description: Platform route stand-in. url is http://<app>.localhost; one HTTPRoute to the workload's Service.
  init: |
    {{ $ports := (index .WorkloadServices .SourceWorkload).Ports }}
    {{ if not $ports }}{{ fail "a route resource serves the workload's Service, so the workload must declare service.ports" }}{{ end }}
  state: |
    routeName: route-{{ .SourceWorkload }}-{{ substr 0 8 .Guid | lower }}
    host: {{ .SourceWorkload }}.localhost
  outputs: |
    url: http://{{ .State.host }}
  expected_outputs:
    - url
  manifests: |
    {{ $svc := (index .WorkloadServices .SourceWorkload) }}
    {{ $port := "" }}
    {{ range $name, $p := $svc.Ports }}{{ if eq (print $port) "" }}{{ $port = $p.Port }}{{ end }}{{ end }}
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: {{ .State.routeName }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: {{ .State.routeName }}
          app.kubernetes.io/instance: {{ .State.routeName }}
      spec:
        parentRefs:
        - name: default
        hostnames:
        - {{ .State.host | quote }}
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: {{ $svc.ServiceName }}
            port: {{ $port }}

# --- service -----------------------------------------------------------------
# `{type: service, params: {app: <name>}}` resolves to the Service of another
# app in the same environment. Here the target must be a workload of the same
# `score-k8s generate` call; pass its Score file too.
- uri: template://glenr/service
  type: service
  description: Host and port of another app in the same generate run.
  init: |
    {{ if not .Params.app }}{{ fail "a service resource needs params.app: the name of another app in this environment, e.g. `api: {type: service, params: {app: api}}`" }}{{ end }}
    {{ if eq (default "" .Params.kind) "postgres" }}{{ fail "params.kind: postgres is served by a resource of type postgres in this export, not by a service reference" }}{{ end }}
    {{ $w := index .WorkloadServices .Params.app }}
    {{ if or (not $w) (not $w.ServiceName) }}{{ fail (printf "service %q: no app named %q in this generate run. Pass its Score file to the same score-k8s generate." .Id .Params.app) }}{{ end }}
    {{ if not $w.Ports }}{{ fail (printf "app %q declares no service.ports, so it has no Service to reach" .Params.app) }}{{ end }}
  outputs: |
    {{ $w := index .WorkloadServices .Params.app }}
    {{ $port := "" }}
    {{ range $name, $p := $w.Ports }}{{ if eq (print $port) "" }}{{ $port = $p.Port }}{{ end }}{{ end }}
    host: {{ $w.ServiceName }}{{ if ne .Namespace "" }}.{{ .Namespace }}.svc.cluster.local{{ end }}
    port: {{ $port }}
  expected_outputs:
    - host
    - port
  supported_params:
    - app
    - kind

# --- external-api ------------------------------------------------------------
# `{type: external-api, params: {host, port}}` names a destination outside the
# cluster. The outputs are the same as on the platform. The platform also
# renders an egress allowlist; vanilla Kubernetes cannot express a DNS-name
# rule, so this file renders none (listed divergence).
- uri: template://glenr/external-api
  type: external-api
  description: Outputs host and port of a named external destination; port defaults to 443.
  init: |
    {{ $host := default "" .Params.host }}
    {{ if not $host }}{{ fail (printf "resources.%s: an external-api resource needs params.host, the DNS name this app depends on, e.g. api.stripe.com" .Id) }}{{ end }}
    {{ if not (regexMatch "^(\\*\\.)?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $host) }}{{ fail (printf "resources.%s: host %q is not a destination this platform can allow. It needs at least two lowercase DNS labels (api.stripe.com), optionally led by *. (*.stripe.com)." .Id $host) }}{{ end }}
    {{ $port := default 443 .Params.port }}
    {{ if or (lt (int $port) 1) (gt (int $port) 65535) }}{{ fail (printf "resources.%s: port %v is not a TCP port (1-65535). Omit it for 443." .Id $port) }}{{ end }}
  outputs: |
    host: {{ .Params.host | quote }}
    port: {{ default 443 .Params.port }}
  expected_outputs:
    - host
    - port
  supported_params:
    - host
    - port

# --- postgres ----------------------------------------------------------------
# One CloudNativePG Cluster and its credential Secret. The Cluster accepts TLS
# connections only and has no superuser access, as on the platform. Requires the
# CloudNativePG operator on the target cluster. Connection fields reach the
# workload as outputs; the password and the CA are Secret references.
- uri: template://glenr/postgres
  type: postgres
  description: CloudNativePG Cluster (TLS only, no superuser) plus its credential Secret.
  init: |
    randomPassword: {{ randAlphaNum 32 | quote }}
  state: |
    cluster: pg-{{ .SourceWorkload }}-{{ substr 0 8 .Guid | lower }}
    secret: pg-{{ .SourceWorkload }}-{{ substr 0 8 .Guid | lower }}-credentials
    database: app
    username: app
    password: {{ dig "password" .Init.randomPassword .State | quote }}
  outputs: |
    host: {{ .State.cluster }}-rw{{ if ne .Namespace "" }}.{{ .Namespace }}.svc.cluster.local{{ end }}
    port: 5432
    database: {{ .State.database }}
    username: {{ .State.username }}
    password: {{ encodeSecretRef .State.secret "password" }}
    ca: {{ encodeSecretRef (printf "%s-ca" .State.cluster) "ca.crt" }}
  expected_outputs:
    - host
    - port
    - database
    - username
    - password
    - ca
  manifests: |
    - apiVersion: v1
      kind: Secret
      type: kubernetes.io/basic-auth
      metadata:
        name: {{ .State.secret }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: {{ .State.secret }}
          app.kubernetes.io/instance: {{ .State.cluster }}
      data:
        username: {{ .State.username | b64enc }}
        password: {{ .State.password | b64enc }}
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: {{ .State.cluster }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: {{ .State.cluster }}
          app.kubernetes.io/instance: {{ .State.cluster }}
      spec:
        instances: 1
        imageName: ghcr.io/cloudnative-pg/postgresql:18
        primaryUpdateStrategy: unsupervised
        enableSuperuserAccess: false
        storage:
          size: 10Gi
        postgresql:
          pg_hba:
          - hostssl all all all scram-sha-256
          - host all all all reject
        bootstrap:
          initdb:
            database: {{ .State.database }}
            owner: {{ .State.username }}
            secret:
              name: {{ .State.secret }}

# --- volume ------------------------------------------------------------------
# `{type: volume, class: ephemeral, params: {size}}` is a scratch volume: an
# `emptyDir` with a `sizeLimit` (design/142 D-142.2). score-k8s's default
# `volume` provisioner returns `emptyDir: {}` with no limit; this override adds
# the platform's `sizeLimit` so the pod is held to the same scratch size. The
# default when `params.size` is absent is the platform's 1Gi (D-142.5). A
# provisioner with no `class` matches every class (score-k8s Match skips the
# class test when the provisioner names none, measured on the version pinned by
# scripts/checks/fetch-score-k8s.sh).
#
# `{type: volume, class: persistent, params: {size}}` is a PersistentVolumeClaim
# (design/146 section S3), the claim the platform's exit dialect renders: named
# `<workload>-vol-<resource>`, ReadWriteOnce, `params.size` 1Gi to 50Gi (default
# 1Gi), and no `storageClassName`, so a plain cluster uses its default class.
# The volume source is `persistentVolumeClaim.claimName`. The claim is created
# empty: volume contents are not in an export. The provisioner sets nothing on
# the pod: write `strategy: Recreate` and one replica yourself (a ReadWriteOnce
# claim does not follow a rolling update to another node), and set a pod
# `fsGroup` if the image runs as a non-root user. It also cannot see which
# containers mount a claim, so a persistent volume that nothing mounts still
# creates a claim (the platform refuses it). The claim is named after the
# workload as score-k8s names it and after the resource key, so a resource that
# sets `id:` is refused.
- uri: template://glenr/volume
  type: volume
  description: Scratch emptyDir with the platform's sizeLimit (default 1Gi), or a PersistentVolumeClaim (class persistent, 1Gi to 50Gi).
  init: |
    {{ if and (ne .Class "ephemeral") (ne .Class "persistent") }}{{ fail (printf "resources.%s: a volume needs class: ephemeral or class: persistent" .Id) }}{{ end }}
    {{ if eq .Class "ephemeral" }}
    {{ if .Params.size }}{{ if not (regexMatch "^[1-9][0-9]*(Mi|Gi)$" (print .Params.size)) }}{{ fail (printf "resources.%s: params.size %v is not a size this platform accepts. Write a whole number of Mi or Gi, for example 2Gi." .Id .Params.size) }}{{ end }}{{ end }}
    {{ if .Params.medium }}{{ fail (printf "resources.%s: params.medium is not supported: a scratch volume is disk-backed. Remove medium." .Id) }}{{ end }}
    {{ else }}
    {{ $res := trimPrefix (printf "%s." .SourceWorkload) .Id }}
    {{ if not (hasPrefix (printf "%s." .SourceWorkload) .Id) }}{{ fail (printf "resources.%s: a persistent volume may not set id: the claim is named after the workload and the resource name" .Id) }}{{ end }}
    {{ $size := print (default "1Gi" .Params.size) }}
    {{ if not (regexMatch "^[1-9][0-9]*Gi$" $size) }}{{ fail (printf "resources.%s.params.size is %q; a persistent volume's size is a whole number of Gi, from 1Gi to 50Gi." $res $size) }}{{ end }}
    {{ if or (lt (atoi (trimSuffix "Gi" $size)) 1) (gt (atoi (trimSuffix "Gi" $size)) 50) }}{{ fail (printf "resources.%s.params.size is %q; a persistent volume is 1Gi to 50Gi." $res $size) }}{{ end }}
    {{ if .Params.medium }}{{ fail (printf "resources.%s.params.medium applies to a scratch volume; remove it from a persistent volume." $res) }}{{ end }}
    {{ $vol := trimAll "-" (regexReplaceAll "[^a-z0-9-]" (lower $res) "-") }}
    {{ if regexMatch "^[0-9]" $vol }}{{ $vol = print "app-" $vol }}{{ end }}
    {{ $claim := printf "%s-vol-%s" .SourceWorkload $vol }}
    {{ if gt (len $claim) 63 }}{{ fail (printf "resources.%s: the claim name %s is %d characters; the limit is 63. Shorten the workload name or the resource name." $res $claim (len $claim)) }}{{ end }}
    claim: {{ $claim | quote }}
    {{ end }}
  outputs: |
    {{ if eq .Class "persistent" }}
    source:
      persistentVolumeClaim:
        claimName: {{ .Init.claim | quote }}
    {{ else }}
    source:
      emptyDir:
        sizeLimit: {{ default "1Gi" .Params.size | quote }}
    {{ end }}
  expected_outputs:
    - source
  supported_params:
    - size
  manifests: |
    {{ if eq .Class "persistent" }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ .Init.claim | quote }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: {{ .Init.claim | quote }}
          app.kubernetes.io/instance: {{ .Init.claim | quote }}
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: {{ default "1Gi" .Params.size | print | quote }}
    {{ end }}

# --- secret ------------------------------------------------------------------
# `{type: secret, params: {name, keys}}` names a Secret you create and the keys
# of it a workload reads. Outputs: `source` (the Secret as a volume source) and
# one Secret reference per key in `params.keys`, so `${resources.<s>.<KEY>}` in a
# `files` entry mounts that key from the Secret. A key must be a placeholder
# segment: letters, digits, `_` and `-`, no `.`; `source` is taken. The provisioner emits no manifest and
# holds no value. A `files` entry that reads a key not listed in `params.keys`
# finds no such output and is refused, which keeps the value out of a ConfigMap.
- uri: template://glenr/secret
  type: secret
  description: Names a customer-created Secret; returns a Secret reference per key and a volume source. No Secret object, no value.
  init: |
    {{ if not .Params.name }}{{ fail (printf "resources.%s: a secret resource needs params.name, the name of the Secret you create from secrets/<env>.example.yaml" .Id) }}{{ end }}
    {{ if not (regexMatch "^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$" (print .Params.name)) }}{{ fail (printf "resources.%s: params.name %q is not a Kubernetes Secret name (lowercase letters, digits, - and ., at most 253 characters)" .Id (print .Params.name)) }}{{ end }}
    {{ if and .Params.keys (not (kindIs "slice" .Params.keys)) }}{{ fail (printf "resources.%s: params.keys must be a list of key names" .Id) }}{{ end }}
    {{ range $k := .Params.keys }}{{ if not (regexMatch "^[A-Za-z_][A-Za-z0-9_-]*$" (print $k)) }}{{ fail (printf "resources.%s: params.keys entry %q is not a placeholder key (letters, digits, _ and -, no .)" $.Id (print $k)) }}{{ end }}{{ if eq (print $k) "source" }}{{ fail (printf "resources.%s: params.keys entry \"source\" is the output that names the Secret as a volume source; rename the key" $.Id) }}{{ end }}{{ end }}
  outputs: |
    source:
      secret:
        secretName: {{ .Params.name | quote }}
    {{ range $k := uniq (default (list) .Params.keys) }}
    {{ $k | quote }}: {{ encodeSecretRef (print $.Params.name) (print $k) }}
    {{ end }}
  expected_outputs:
    - source
  supported_params:
    - name
    - keys

# NetworkPolicy for the score-k8s route (README, "The second route").
#
# `_namespace.yaml` creates a default-deny ingress NetworkPolicy. The
# `manifests/` route carries its own allow policy (`web-from-ingress`); the
# objects score-k8s renders carry none. Without this file no pod in the
# namespace accepts ingress: the CloudNativePG operator cannot reach its
# instance (`Instance Status Extraction Error: HTTP communication issue`, the
# Cluster never becomes Ready) and the ingress controller cannot reach `web`.
#
# Allowed sources: pods of the same namespace, the namespace of your ingress
# controller (`traefik` here; use the name of yours) and `cnpg-system`, where
# the CloudNativePG operator runs.
#
# Apply it into the cell namespace: kubectl -n <namespace> apply -f examples/score-k8s-allow-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-route-and-database
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["traefik", "cnpg-system"]

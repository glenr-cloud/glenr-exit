# Secrets this environment's workloads read.
# Every value below is EMPTY: Glenr stores secret values write-only and
# never exported them. Fill each one from your own records, then apply
# this file into the cell's namespace before the workloads.

---
# the environment's own secrets (the keys you set on Glenr; names and values are yours to fill)
apiVersion: v1
kind: Secret
metadata:
  name: glenr-app-secrets
  namespace: exit-fixture-production
type: Opaque
stringData:
  FILL_ME: ""

---
# the secret file `token` that web mounts (resource `token`, params.name web-secret)
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: exit-fixture-production
type: Opaque
stringData:
  token: ""

---
# the PostgreSQL connection for `maindb`: point it at a database you run (same or a later major version as the export records)
apiVersion: v1
kind: Secret
metadata:
  name: maindb-connection
  namespace: exit-fixture-production
type: Opaque
stringData:
  host: ""
  port: ""
  dbname: ""
  user: ""
  password: ""
  uri: ""

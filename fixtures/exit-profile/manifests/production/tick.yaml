apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: exit-fixture-production
  labels:
    app.kubernetes.io/name: tick
    app.kubernetes.io/part-of: exit-fixture
    app.kubernetes.io/instance: production
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tick
            app.kubernetes.io/part-of: exit-fixture
            app.kubernetes.io/instance: production
        spec:
          restartPolicy: OnFailure
          hostUsers: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: main
            image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
            command:
            - /bin/sh
            - -c
            args:
            - echo tick
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: "100m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "64Mi"
